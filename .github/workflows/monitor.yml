name: CS2 overvaagning

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python monitor.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: Gem hvad der allerede er meldt
        run: |
          git config user.name "cs2-bot"
          git config user.email "cs2-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Opdater state" && git push)
